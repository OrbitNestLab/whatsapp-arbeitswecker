[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-arbeitswecker"
version = "1.0.0"
description = "Sichere WhatsApp-Cloud-API-Bridge für einen Home-Assistant-Arbeitswecker"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["app"]
